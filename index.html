<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BENCH-01 | 焊接元器件查询</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </span>
          <span class="brand__text">
            <span class="brand__title">BENCH-01</span>
            <span class="brand__subtitle">焊接元器件查询</span>
          </span>
        </a>
        <div class="topbar__actions">
          <button class="button button--primary" id="newBtn" title="新增元器件">新增</button>
          <button class="button button--ghost" id="syncBtn" title="同步到 Gist">同步</button>
          <button class="button button--ghost" id="importBtn" title="导入 JSON">导入</button>
          <button class="button button--ghost" id="exportBtn" title="导出 JSON">导出</button>
          <button class="button button--ghost" id="settingsBtn" title="设置">设置</button>
          <button class="icon-button" id="themeBtn" title="切换主题" aria-label="切换主题" type="button">
            <svg class="icon theme-icon__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" />
              <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <svg class="icon theme-icon__moon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="toolbar">
        <div class="field">
          <label class="field__label" for="search">搜索</label>
          <input class="input" id="search" placeholder="按名称或型号搜索" />
        </div>
        <div class="field">
          <label class="field__label" for="filterCategory">种类</label>
          <select class="select" id="filterCategory"><option value="">全部</option></select>
        </div>
        <div class="field">
          <label class="field__label" for="filterPackage">封装</label>
          <select class="select" id="filterPackage"><option value="">全部</option></select>
        </div>
        <div class="field">
          <label class="field__label" for="filterStock">库存</label>
          <select class="select" id="filterStock">
            <option value="all">全部</option>
            <option value="in">有货</option>
            <option value="out">缺货</option>
          </select>
        </div>
        <div class="toolbar__summary" id="listSummary">共 0 项</div>
      </section>

      <section class="panels">
        <section class="panel panel--list">
          <div class="panel__header">
            <div class="panel__title">元器件列表</div>
            <div class="panel__actions">
              <button class="button button--primary button--small" id="queryNewBtn" hidden>新增</button>
            </div>
          </div>
          <div class="list" id="componentList"></div>
          <div class="empty" id="listEmpty">
            <div class="empty__title">暂无元器件</div>
            <div class="empty__desc">点击新增或导入 JSON，开始建立你的元件库。</div>
          </div>
        </section>

        <section class="panel panel--detail" id="queryDetailPanel">
          <div class="panel__header">
            <div class="panel__title" id="detailTitle">选择一个元器件查看详情</div>
            <div class="panel__actions" id="detailActions" hidden>
              <button class="button button--danger button--small" id="deleteBtn">删除</button>
              <button class="button button--primary button--small" id="saveBtn">保存</button>
            </div>
          </div>
          <div class="detail" id="detail">
            <div class="empty">
              <div class="empty__title">未选择条目</div>
              <div class="empty__desc">从左侧列表选择一个元器件，即可查看详情与快速操作。</div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="底部快捷导航">
      <a class="mobile-nav__item is-active" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>查询</span>
      </a>
      <a class="mobile-nav__item" href="admin/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>管理</span>
      </a>
      <a class="mobile-nav__item" href="admin/#settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </a>
    </nav>

    <dialog class="dialog" id="formDialog" aria-modal="true" aria-labelledby="formDialogTitle">
      <div class="dialog__body">
        <div class="dialog__header">
          <div class="dialog__title" id="formDialogTitle">新增元器件</div>
          <button class="button button--ghost button--icon" id="closeFormBtn" aria-label="关闭" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <form class="form" id="componentForm" autocomplete="off">
          <input type="hidden" id="formId" />
          <div class="form__grid">
            <div class="field">
              <label class="field__label" for="formName">名称 <span class="required">*</span></label>
              <input class="input" id="formName" required />
            </div>
            <div class="field">
              <label class="field__label" for="formCategory">种类 <span class="required">*</span></label>
              <input class="input" id="formCategory" list="categoryOptions" required placeholder="电阻、电容、MCU..." />
              <datalist id="categoryOptions"></datalist>
            </div>
            <div class="field">
              <label class="field__label" for="formModel">型号</label>
              <input class="input" id="formModel" />
            </div>
            <div class="field">
              <label class="field__label" for="formPackage">封装</label>
              <input class="input" id="formPackage" list="packageOptions" placeholder="0805、SOT-23..." />
              <datalist id="packageOptions"></datalist>
            </div>
            <div class="field">
              <label class="field__label" for="formQuantity">数量</label>
              <input class="input" id="formQuantity" type="number" inputmode="numeric" min="0" step="1" />
            </div>
            <div class="field">
              <label class="field__label" for="formLocation">位置/库位</label>
              <input class="input" id="formLocation" />
            </div>
            <div class="field field--full">
              <label class="field__label" for="formDatasheet">数据手册链接</label>
              <input class="input" id="formDatasheet" placeholder="https://..." />
            </div>
            <div class="field field--full">
              <label class="field__label" for="formNotes">备注</label>
              <textarea class="textarea" id="formNotes" rows="3"></textarea>
            </div>
          </div>
          <div class="dialog__footer">
            <button type="button" class="button button--ghost" id="cancelFormBtn">取消</button>
            <button type="submit" class="button button--primary">保存</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog class="dialog" id="quantityDialog" aria-modal="true" aria-labelledby="quantityDialogTitle">
      <div class="dialog__body">
        <div class="dialog__header">
          <div class="dialog__title" id="quantityDialogTitle">调整数量</div>
          <button class="button button--ghost button--icon" id="closeQuantityBtn" aria-label="关闭" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <form class="form" id="quantityForm" autocomplete="off">
          <input type="hidden" id="quantityId" />
          <div class="form__grid">
            <div class="field">
              <label class="field__label" for="quantityMode">模式</label>
              <select class="select" id="quantityMode">
                <option value="increase">增加</option>
                <option value="decrease">减少</option>
                <option value="set">设为</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="quantityValue">数量 <span class="required">*</span></label>
              <input class="input" id="quantityValue" type="number" inputmode="numeric" min="0" step="1" required />
            </div>
          </div>
          <div class="dialog__footer">
            <button type="button" class="button button--ghost" id="cancelQuantityBtn">取消</button>
            <button type="submit" class="button button--primary">应用</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog class="dialog" id="settingsDialog" aria-modal="true" aria-labelledby="settingsDialogTitle">
      <div class="dialog__body">
        <div class="dialog__header">
          <div class="dialog__title" id="settingsDialogTitle">设置</div>
          <button class="button button--ghost button--icon" id="closeSettingsBtn" aria-label="关闭" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <form class="form" id="settingsForm" autocomplete="off">
          <div class="form__grid">
            <div class="field field--full">
              <label class="field__label" for="githubToken">GitHub Personal Access Token（gist 权限）</label>
              <input class="input" id="githubToken" placeholder="ghp_..." />
              <div class="field__hint">建议使用 classic token，仅授予 gist 权限；不会上传到任何第三方服务。</div>
            </div>
            <div class="field field--full">
              <label class="field__label" for="gistUrl">现有 Gist 地址</label>
              <input class="input" id="gistUrl" placeholder="https://gist.github.com/..." />
              <div class="field__hint">留空会在同步时自动创建新的私有 Gist。</div>
            </div>
          </div>
          <div class="dialog__footer">
            <button type="button" class="button button--ghost" id="cancelSettingsBtn">取消</button>
            <button type="submit" class="button button--primary">保存</button>
          </div>
        </form>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="importFile" accept="application/json" hidden />
    <script src="src/front.js"></script>
  </body>
  </html>
